        const ImageWithFallback = ({ src, alt, className, fallbacks = [] }) => {
            const [currentSrc, setCurrentSrc] = useState(src);
            const [attempt, setAttempt] = useState(0);
            const [hasError, setHasError] = useState(false);

            const handleError = () => {
                if (attempt < fallbacks.length) {
                    // 次の候補を試す
                    console.log(`Image load failed: ${currentSrc}. Trying fallback: ${fallbacks[attempt]}`);
                    setCurrentSrc(fallbacks[attempt]);
                    setAttempt(prev => prev + 1);
                } else {
                    // 全て失敗した場合
                    console.log(`All image attempts failed for ${alt}`);
                    setHasError(true);
                }
            };

            if (hasError) {
                // 画像がない場合のプレースホルダー
                return (
                    <div className={`bg-gray-200 flex items-center justify-center text-gray-400 text-xs p-2 text-center border border-gray-300 ${className}`} style={{minHeight: "100px"}}>
                        <div className="space-y-1">
                            <span>画像が見つかりません</span><br/>
                            <span className="text-[10px] opacity-70">{alt}</span>
                        </div>
                    </div>
                );
            }

            return (
                <img 
                    src={currentSrc} 
                    alt={alt} 
                    className={className} 
                    onError={handleError} 
                />
            );
        };
